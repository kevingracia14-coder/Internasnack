<!DOCTYPE html>
<html lang="id" class="scroll-smooth" data-theme="light" data-font-size="normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Interna Snack — Clinical Reference &amp; SpPD Board Companion</title>
  <meta name="theme-color" content="#F2F2F7" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Google Fonts: Non-render-blocking load -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" /></noscript>

  <!-- Early Theme & Reading Scale Init (Zero FOUC) -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem("internasnack_sppd_state_v2");
        if (!raw) return;
        var st = JSON.parse(raw);
        var fs = st && st.fontSizePreference;
        if (fs === "normal" || fs === "large" || fs === "xlarge") {
          document.documentElement.setAttribute("data-font-size", fs);
        }
        var tp = st && st.themePreference;
        var isDark = tp === "dark" || (tp !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>

  <!-- Compiled Static Tailwind CSS + Clean Clinical Design System (v2 Offline-First) -->
  <link rel="stylesheet" href="tailwind.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="antialiased selection:bg-[#0F766E]/15 selection:text-[#0F766E] dark:selection:bg-[#2DD4BF]/20 dark:selection:text-[#2DD4BF]">

  <script src="src/core/app.js"></script>
  <script>
    (function () {
      window.__INTERNA_OFFLINE_STATUS__ = {
        supported: 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'),
        ready: false,
        online: navigator.onLine !== false
      };

      function notifyOfflineStatus() {
        window.dispatchEvent(new CustomEvent('interna:offline-status', {
          detail: Object.assign({}, window.__INTERNA_OFFLINE_STATUS__)
        }));
      }

      if (window.__INTERNA_OFFLINE_STATUS__.supported) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').then(function (reg) {
            if (reg.active) {
              window.__INTERNA_OFFLINE_STATUS__.ready = true;
              notifyOfflineStatus();
            }
            reg.addEventListener('updatefound', function () {
              var newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', function () {
                if (newWorker.state === 'activated') {
                  window.__INTERNA_OFFLINE_STATUS__.ready = true;
                  notifyOfflineStatus();
                }
              });
            });
            navigator.serviceWorker.ready.then(function () {
              window.__INTERNA_OFFLINE_STATUS__.ready = true;
              notifyOfflineStatus();
            });
          }).catch(function (err) {
            console.warn('ServiceWorker registration skipped:', err);
          });
        });
      }
    })();
  </script>
</body>
